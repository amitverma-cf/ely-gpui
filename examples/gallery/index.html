<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ely Gallery</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fcfaf7; }
      html.dark, html.dark body { background: #131110; }
    </style>
    <script>
      // Ely's ground under the canvas until the first frame.
      if (new URLSearchParams(location.search).get("theme") === "dark") {
        document.documentElement.classList.add("dark");
      }
    </script>
    <script>
      // Embedded, gpui's hidden field waits for a press or key.
      if (window.parent !== window) {
        let touched = false;
        // Until then its focus calls leave the host's focus alone.
        const focus = HTMLElement.prototype.focus;
        HTMLElement.prototype.focus = function (options) {
          if (touched) focus.call(this, options);
        };
        const touch = () => {
          if (touched) return;
          touched = true;
          document.querySelector("textarea")?.focus({ preventScroll: true });
        };
        addEventListener("pointerdown", touch, true);
        addEventListener("keydown", touch, true);
      }
    </script>
    <script type="module">
      import init, { set_theme } from "./gallery.js";
      // The host sets the mode by setTheme or a message.
      let early = null;
      let apply = (theme) => { early = theme; };
      const setTheme = (theme) => {
        apply(theme);
        document.documentElement.classList.toggle("dark", theme === "dark");
      };
      window.gallery = { setTheme };
      addEventListener("message", ({ data }) => {
        if (data && data.ely === "theme") setTheme(data.theme);
      });

      // Accelerated wasm loader with in-memory parent sharing & CacheStorage persistence
      async function getWasmModule() {
        // 1. In-memory compiled module shared across same-origin iframe navigations
        try {
          if (window.parent && window.parent !== window && window.parent.__ELY_WASM_MODULE__) {
            return window.parent.__ELY_WASM_MODULE__;
          }
        } catch (_) {}

        const wasmUrl = new URL("./gallery_bg.wasm", import.meta.url).href;

        // 2. CacheStorage persistence so 20MB is never re-downloaded on page refresh/revisit
        if ("caches" in window) {
          try {
            const cache = await caches.open("ely-gallery-wasm-v1");
            const cached = await cache.match(wasmUrl);
            if (cached) {
              const module = await WebAssembly.compileStreaming(cached.clone()).catch(async () => {
                const buf = await cached.arrayBuffer();
                return await WebAssembly.compile(buf);
              });
              if (module) {
                try {
                  if (window.parent && window.parent !== window) {
                    window.parent.__ELY_WASM_MODULE__ = module;
                  }
                } catch (_) {}
                return module;
              }
            }
          } catch (e) {
            console.warn("WASM cache load failed, falling back to network", e);
          }
        }

        // 3. Network fetch + compile + populate cache
        try {
          const resp = await fetch(wasmUrl);
          if (resp.ok) {
            if ("caches" in window) {
              caches.open("ely-gallery-wasm-v1").then((cache) => {
                cache.put(wasmUrl, resp.clone()).catch(() => {});
              });
            }
            const module = await WebAssembly.compileStreaming(resp.clone()).catch(async () => {
              const buf = await resp.arrayBuffer();
              return await WebAssembly.compile(buf);
            });
            if (module) {
              try {
                if (window.parent && window.parent !== window) {
                  window.parent.__ELY_WASM_MODULE__ = module;
                }
              } catch (_) {}
              return module;
            }
          }
        } catch (e) {
          console.warn("WASM fetch failed, using default init()", e);
        }

        return undefined;
      }

      for (let attempt = 1; ; attempt++) {
        try {
          const module = await getWasmModule();
          if (module) {
            await init(module);
          } else {
            await init();
          }
          break;
        } catch (error) {
          console.warn(`gallery: start failed, try ${attempt}`, error);
          if (attempt === 3) {
            window.parent.postMessage({ ely: "failed", error: String(error) }, "*");
            throw error;
          }
          await new Promise((wake) => setTimeout(wake, 1000 * attempt));
        }
      }
      apply = set_theme;
      if (early) set_theme(early);
      // Tells the host that a mode it sends now lands.
      window.parent.postMessage({ ely: "ready" }, "*");
    </script>
  </head>
  <body></body>
</html>
