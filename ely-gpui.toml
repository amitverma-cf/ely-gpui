[paths]
assets_dir = "assets"
icons_dir = "assets/icons"
fonts_dir = "assets/fonts"
scan_sources = ["src/**/*.rs", "examples/**/*.rs"]

[theme]
default_mode = "system"
high_contrast = false
color_blind_safe = false
density = "standard"
radius_scale = 1.0
font_scale = 1.0
preset = "ely"

